name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy-test:
    name: fmt / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo clippy --all-targets --features test-hooks -- -D warnings
        run: cargo clippy --all-targets --features test-hooks -- -D warnings

      # The real-mount black box (tests/agent24_mount_blackbox.rs) is
      # `#[ignore]`d — it needs a sibling Agent24 checkout this CI job does
      # not build (docs/agent/tasks.md T1.1.1「开发范围」: "黑盒是
      # #[ignore]，不进 CI"). Plain `cargo test` never runs it.
      - name: cargo test
        run: cargo test
